<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Save the Princess — Yutfi MiniGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@500;700;800&family=Press+Start+2P&family=Silkscreen:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root{--gold:#fbbf24;--ink:#0a0710;--panel:#17102a;--line:#ffffff1f;--txt:#ece8f7;--dim:#a8a1c2;--vio:#8b5cf6;--pink:#f472b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07040d;color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 70% 55% at 50% 0%,#33195a 0%,#10081f 55%,#05030a 100%)}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1.4px);background-size:34px 34px;opacity:.5;pointer-events:none}
#cv{position:relative;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;display:block;background:#12091f;box-shadow:0 0 0 1px #ffffff1c,0 0 0 4px #0b0616,0 0 0 5px #fbbf2444,0 30px 90px #000;touch-action:none;border-radius:6px}
@media (max-width:900px),(max-height:520px){#cv{border-radius:0;box-shadow:none}}
.hidden{display:none!important}
#top{position:fixed;left:8px;top:5px;z-index:30;display:flex;gap:6px}
#top .chip{border:1px solid #ffffff2a;background:rgba(18,11,34,.78);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px #0008;font-family:inherit;line-height:1.2}
#top .chip:hover{background:rgba(60,36,110,.9);border-color:#fbbf2488}
@media (max-width:900px){#top .lbl{display:none}#top .chip{padding:6px 10px;font-size:13px}}
#ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(ellipse at 50% 30%,rgba(40,20,80,.72),rgba(4,2,10,.9));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto}
.card{position:relative;width:min(100%,var(--w,640px));max-height:100%;overflow:auto;border-radius:24px;padding:22px 20px;background:linear-gradient(180deg,rgba(46,26,86,.96),rgba(20,11,40,.97));border:1px solid #ffffff2e;box-shadow:0 30px 90px #000d,inset 0 1px 0 #ffffff26,0 0 0 1px #0008;animation:pop .28s cubic-bezier(.2,1.2,.3,1)}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,transparent,#fbbf24,transparent);border-radius:2px;opacity:.9}
.card::-webkit-scrollbar{width:8px}.card::-webkit-scrollbar-thumb{background:#ffffff30;border-radius:8px}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
h1,h2,h3{font-family:'Cinzel',Georgia,serif;margin:0;color:#fff;text-align:center}
h1{font-size:clamp(26px,5vw,42px);letter-spacing:.02em;background:linear-gradient(180deg,#fff7d6,#fbbf24 55%,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 22px #fb923c66)}
h2{font-size:clamp(20px,3.6vw,28px);text-shadow:0 2px 0 #000a}
.sub{color:var(--dim);text-align:center;font-size:13px;margin:6px 0 12px;line-height:1.45}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#5b3fa8,#3b2a66);box-shadow:0 4px 0 #1a1033,0 8px 18px #0006,inset 0 1px 0 #ffffff30;font-family:inherit;transition:transform .08s,filter .15s;letter-spacing:.01em}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a1033}
.btn.go{position:relative;overflow:hidden;background:linear-gradient(180deg,#fef08a,#f59e0b 60%,#ea580c);color:#2a1300;box-shadow:0 4px 0 #92400e,0 10px 24px #f59e0b44,inset 0 1px 0 #fff9}
.btn.go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#fff8,transparent);animation:shine 2.8s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.dim{background:linear-gradient(180deg,#2b1f47,#211738);color:#cdc5e6}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#120a22}
.seg button{border:0;background:transparent;color:#cdc5e6;padding:8px 13px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.seg button:hover{background:#ffffff14}
.seg button.on{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#2a1300}
.slot{border:1px solid var(--line);border-radius:18px;padding:12px;background:linear-gradient(180deg,#24173f,#1a1030);margin-top:10px;display:grid;gap:10px;position:relative;overflow:hidden}
.slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,#fff)}
.slot .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff6,0 0 10px currentColor}
.slot input[type=text]{background:#0d0719;border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 11px;font-weight:800;width:140px;font-family:inherit;font-size:13px}
.slot input[type=text]:focus{outline:2px solid #fbbf2488}
.races{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.race{border:1px solid var(--line);border-radius:14px;padding:8px 4px 7px;background:#120a22;color:#fff;cursor:pointer;text-align:center;font-family:inherit;transition:transform .12s,background .15s,box-shadow .15s}
.race:hover{transform:translateY(-2px);background:#201437}
.race .e{font-size:30px;line-height:1.15;filter:drop-shadow(0 3px 3px #0008)}.race .n{font-size:11px;font-weight:800}.race .tg{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.race.on{background:linear-gradient(180deg,#4a2f8a,#2d1b57);box-shadow:0 0 0 2px #fbbf24,0 6px 18px #fbbf2433}
.abil{font-size:11.5px;color:var(--dim);line-height:1.4;min-height:30px}
.abil b{color:var(--gold)}
.big{font-size:clamp(44px,12vw,70px);text-align:center;line-height:1;filter:drop-shadow(0 6px 10px #000a)}
.list{display:grid;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:linear-gradient(180deg,#2a1b48,#1f1337);border:1px solid var(--line);text-align:left;color:#fff;cursor:pointer;font-family:inherit;width:100%;transition:transform .1s,border-color .15s}
.item:hover:not([disabled]){border-color:#fbbf2488;transform:translateY(-1px)}
.item[disabled]{opacity:.45;cursor:default}
.item .ic{font-size:28px;width:38px;text-align:center;filter:drop-shadow(0 2px 3px #0008)}
.item .tt{font-weight:800;font-size:14px}.item .ds{font-size:11.5px;color:var(--dim)}
.item .rt{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#ffffff1a;color:#e9d5ff}
.res{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;background:linear-gradient(90deg,#2a1b48,#1f1337);margin-top:7px;border:1px solid #ffffff10}
.res:first-of-type{border-color:#fbbf2466}
.res .pl{font-weight:800;flex:1;text-align:left}.res .md{font-size:22px;width:34px;text-align:center}
.res .mv{font-weight:800;min-width:60px;text-align:right}
.up{color:#86efac}.down{color:#fca5a5}.gd{color:var(--gold)}
@media (max-width:900px){#banner{top:44px}}
#banner{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:35;padding:10px 20px;border-radius:16px;background:rgba(18,10,36,.92);border:1px solid #fbbf2477;font-weight:800;font-size:15px;max-width:92vw;text-align:center;box-shadow:0 12px 40px #000b,0 0 24px #fbbf2422;animation:pop .22s ease-out;backdrop-filter:blur(8px)}
#touch{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-between;padding:10px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,clamp(40px,11.5vh,68px));grid-template-rows:repeat(3,clamp(40px,11.5vh,68px));gap:5px;pointer-events:auto}
#touch button{border:1px solid #ffffff55;background:radial-gradient(circle at 30% 25%,#ffffff40,#ffffff14);color:#fff;border-radius:18px;font-size:22px;font-weight:800;touch-action:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 4px 0 #0006,inset 0 1px 0 #fff5;transition:transform .05s}
#touch button.on{background:radial-gradient(circle at 30% 25%,#fde68a,#f59e0b);transform:translateY(3px) scale(.96);box-shadow:0 1px 0 #0006}
#touch .rt{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:8px;pointer-events:none}
#touch .pow{pointer-events:auto;width:clamp(48px,14vh,70px);height:clamp(48px,14vh,70px);border-radius:50%;font-size:22px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,#fef08a,#d97706aa);border-color:#fde68a}
#touch .pow small{font-size:8px;letter-spacing:.06em;margin-top:2px}
#touch .pow.hidden{display:none}
#touch .act{pointer-events:auto;width:clamp(70px,20vh,104px);height:clamp(70px,20vh,104px);border-radius:50%;font-size:13px;letter-spacing:.08em;background:radial-gradient(circle at 30% 25%,#fecdd3,#ef444488)}
.rot{display:none}
@media (orientation:portrait) and (max-width:700px){.rot{display:flex;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;background:radial-gradient(ellipse at 50% 40%,#2a1550,#07040d);font-weight:800;font-size:16px;color:#fde68a}.rot .ph{font-size:64px;animation:rotp 2.2s ease-in-out infinite}.rot button{margin-top:6px}}
@keyframes rotp{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.keys{font-size:11.5px;color:var(--dim);line-height:1.7;text-align:center;margin-top:10px}
.keys kbd{background:#0d0719;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:#fff;font-weight:800;font-family:inherit}
.conf{position:fixed;inset:0;pointer-events:none;z-index:36}
#ov.end{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-end;padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px}.chips .chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;border:1.5px solid #fff4;background:#ffffff10}
.card .row.sticky{position:sticky;bottom:-22px;background:linear-gradient(180deg,transparent,#140b28 42%);padding:12px 0 4px;margin-top:6px}
#ov.end .card{background:linear-gradient(180deg,rgba(46,26,86,.92),rgba(20,11,40,.94))}
.hero{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:4px}
.hero .crown{font-size:44px;filter:drop-shadow(0 6px 10px #0009);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.lab{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c4b5fd;align-self:center}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.mode{border:1px solid var(--line);border-radius:14px;padding:10px 6px;background:#150c29;color:#fff;cursor:pointer;font-family:inherit;text-align:center;transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode .mi{font-size:24px}.mode .mn{font-weight:800;font-size:12.5px;margin-top:2px}
.mode.on{background:linear-gradient(180deg,#4a2f8a,#2d1b57);box-shadow:0 0 0 2px #fbbf24}

#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:45;pointer-events:none}
#splash.hidden{display:none}
#splash::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 45%,transparent),transparent 62%);animation:spFlash 1.15s ease both}
#splash .sp{position:relative;display:flex;flex-direction:column;align-items:center;animation:spPop 1.15s cubic-bezier(.2,1.5,.3,1) both;filter:drop-shadow(0 10px 30px #000b)}
.sp-ic{font-size:min(28vh,180px);line-height:1;animation:spWob .45s ease-in-out 3}
.sp-t{font-family:'Press Start 2P',monospace;font-size:clamp(16px,5vh,36px);color:#fff;margin-top:8px;letter-spacing:.04em;text-shadow:0 4px 0 var(--c),0 0 26px var(--c);-webkit-text-stroke:2px #1e1b4b;paint-order:stroke fill;text-align:center;padding:0 12px}
@keyframes spPop{0%{transform:scale(.15) rotate(-14deg);opacity:0}25%{transform:scale(1.18) rotate(3deg);opacity:1}40%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:scale(1.3);opacity:0}}
@keyframes spWob{50%{transform:rotate(9deg) scale(1.1)}}
@keyframes spFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.gacha{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0;perspective:800px}
.skc{width:152px;border-radius:16px;padding:11px 9px;background:linear-gradient(160deg,#2a1e52,#120b26);border:2px solid var(--rc);box-shadow:0 0 0 1px #0008,0 0 22px -4px var(--rc);text-align:center;opacity:0;animation:skIn .75s cubic-bezier(.2,1.4,.3,1) forwards;animation-delay:var(--d)}
.skc .who{font-size:11.5px;font-weight:800;margin-bottom:3px}
.skc .rar{font-size:8.5px;letter-spacing:.16em;color:var(--rc);font-weight:800}
.skc .ico{font-size:42px;margin:3px 0;animation:skPulse 2.2s ease-in-out infinite}
.skc .nm{font-weight:800;font-size:13px}
.skc .ds{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.35}
.skc.ssr{background:linear-gradient(160deg,#5b3a05,#1c1204 70%);animation:skIn .75s cubic-bezier(.2,1.4,.3,1) forwards,skGlow 1.6s ease-in-out .9s infinite;animation-delay:var(--d),0s}
@keyframes skIn{0%{opacity:0;transform:translateY(34px) rotateY(100deg) scale(.7)}100%{opacity:1;transform:none}}
@keyframes skPulse{50%{transform:scale(1.14) rotate(-4deg)}}
@keyframes skGlow{50%{box-shadow:0 0 0 1px #0008,0 0 44px 4px var(--rc)}}
.gacha-hd{display:flex;justify-content:center}
.circle{position:relative;width:128px;height:128px;margin:6px auto 2px;display:flex;align-items:center;justify-content:center;font-size:52px}
.circle::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px dashed #c084fc;box-shadow:0 0 34px #a855f7aa inset,0 0 26px #a855f788;animation:spin 7s linear infinite}
.circle::after{content:'';position:absolute;inset:16px;border-radius:50%;border:2px solid #67e8f9aa;animation:spin 4s linear infinite reverse}
.circle span{position:relative;animation:skPulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{animation:cardIn .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardIn{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:none}}
.item,.res{animation:itemIn .4s ease both}
.res:nth-child(2){animation-delay:.08s}.res:nth-child(3){animation-delay:.16s}.res:nth-child(4){animation-delay:.24s}.res:nth-child(5){animation-delay:.32s}
@keyframes itemIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
.hero .crown{animation:crown 2.4s ease-in-out infinite}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="rot" id="rot"><div class="ph">📱</div><div>Rotate your phone to landscape<br><span style="font-weight:600;font-size:13px;color:#c4b5fd">Save the Princess plays best sideways</span></div><button class="btn dim" onclick="this.parentNode.style.display='none'">Play anyway</button></div>
<div id="top"><a class="chip" href="index.html" id="home" aria-label="Back to Yutfi MiniGames">←<span class="lbl"> Yutfi MiniGames</span></a><button class="chip" id="snd" onclick="toggleAudio()" aria-label="Sound">🔊</button><button class="chip hidden" id="quit" onclick="quitMatch()" aria-label="Quit">⏏<span class="lbl"> Quit</span></button></div>
<div id="touch" class="hidden">
  <div class="pad"><span></span><button data-k="u">▲</button><span></span><button data-k="l">◀</button><span></span><button data-k="r">▶</button><span></span><button data-k="d">▼</button><span></span></div>
  <div class="rt"><button class="pow hidden" id="pow" data-k="w">⚡<small>POWER</small></button><button class="act" data-k="a">ACTION</button></div>
</div>
<div id="banner" class="hidden"></div>
<div id="splash" class="hidden"></div>
<div id="ov" class="hidden"><div class="card" id="ovcard"></div></div>
<script>
'use strict';
/* ============================================================
   SAVE THE PRINCESS — a local party game (2–4 players, bots fill in)
   Part 1: helpers, input, audio, mini-game runtime
   ============================================================ */
const $ = id => document.getElementById(id);
const W = 960, H = 540;
const cv = $('cv'), c = cv.getContext('2d');
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const RACES = {
  human:  { name: 'Human',  emoji: '🧑', tag: 'Balanced', ab: 'Second Chance',      abd: 'Cancels your first setback (a move backwards).' },
  angel:  { name: 'Angel',  emoji: '👼', tag: 'Airborne', ab: 'Divine Protection',  abd: 'Blocks the first sabotage aimed at you. Floaty jumps.' },
  devil:  { name: 'Devil',  emoji: '😈', tag: 'Brawler',  ab: 'Infernal Strength',  abd: 'Your first win moves you 1 extra space. Pushes harder.' },
  wizard: { name: 'Wizard', emoji: '🧙', tag: 'Trickster', ab: 'Magical Trick',     abd: 'Reflects the first sabotage back at whoever sent it.' }
};
const PCOL = ['#ef4444', '#3b82f6', '#22c55e', '#eab308'];

/* ---------- crisp (HiDPI) canvas ---------- */
let SC = 1;
function fitCanvas() {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3), px = Math.min(Math.round(r.width * dpr), 2560), w = Math.max(960, px);
  if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * 9 / 16); }
  SC = cv.width / W;
}
window.addEventListener('resize', fitCanvas); window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(cv);

/* ---------- drawing helpers ---------- */
const PXF = "'Press Start 2P','Silkscreen','Courier New',monospace";
function txt(s, x, y, size = 20, col = '#fff', align = 'center', stroke) {
  c.font = `800 ${size}px 'Plus Jakarta Sans',system-ui,sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineWidth = Math.max(3, size / 6); c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
// chunky pixel-font text with a hard drop shadow (arcade look) — used for counters, countdowns and callouts
function ptxt(s, x, y, size = 16, col = '#fff', align = 'center', sh = '#000') {
  c.font = `${size}px ${PXF}`; c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  const o = Math.max(2, Math.round(size / 8));
  if (sh) { c.fillStyle = sh; c.fillText(s, x + o, y + o); c.lineWidth = Math.max(2, size / 5); c.strokeStyle = sh; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
function emo(e, x, y, size = 30, alpha = 1) {

async function chooseRoute(p) {

    const tot = keys.filter(k => w[k]).reduce((a, k) => a + w[k], 0); let r = Math.random() * tot; for (const k of keys) { if (!w[k]) continue; r -= w[k]; if (r <= 0) return k; } return keys[0];

  for (let i = E.parts.length - 1; i >= 0; i--) { const q = E.parts[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt; q.r += dt * 6; if (q.life !== undefined) { q.life -= dt; if (q.life <= 0) { E.parts.splice(i, 1); continue; } }
    if (q.emoji) emo(q.emoji, q.x, q.y, q.s); else { c.save(); c.translate(q.x, q.y); c.rotate(q.r); c.fillStyle = q.col; c.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); c.restore(); }
    if (q.y > H + 20 || q.y < -60) E.parts.splice(i, 1); }
  const a = clamp(t / 0.8, 0, 1); c.save(); c.globalAlpha = a; txt(ed.title.toUpperCase(), W / 2, 62 + (1 - a) * -20, 44, '#fde047', 'center', '#000'); c.restore();
}
async function finale() {
  MODE = 'end'; $('quit').classList.add('hidden'); startEndScene(); musSync(); sfx(M.ending === 'dragon' ? 'lose' : 'win');
  await wait(4300);
  const ed = ENDINGS[M.ending], w = M.winner;
  const chips = M.players.map(p => `<span class="chip" style="border-color:${p.color}">${RACES[p.race].emoji} ${esc(p.name)}${p === w ? ' 👑' : ''} · 🪙${p.gold} · 🏆${p.wins}</span>`).join('');
  const pr = ask(`<h2>${ed.title}</h2><div class="sub" style="color:#e7e3f1;margin-bottom:8px">${ed.text(w ? esc(w.name) : '')}</div><div class="chips">${chips}</div><div class="row"><button class="btn go" data-v="again">⚔️ Another adventure</button><button class="btn" data-v="setup">Change players</button><button class="btn dim" data-v="hub">← Yutfi MiniGames</button></div>`, 620);
  $('ov').classList.add('end');
  const v = await pr;
  if (v === 'again') { $('ov').classList.remove('end'); await startMatch(M.cfg); }
  else if (v === 'setup') { $('ov').classList.remove('end'); M = null; END = null; showSetup(); }
  else location.href = 'index.html';
}

/* ---------- setup screen ---------- */
const BOT_NAMES = ['Mira', 'Dax', 'Luna', 'Bolt'];
let CFG = { n: 3, mode: 'classic', diff: 'normal', slots: [{ name: 'Player 1', race: 'human', bot: false }, { name: 'Mira', race: 'wizard', bot: true }, { name: 'Dax', race: 'devil', bot: true }, { name: 'Luna', race: 'angel', bot: true }] };
try { const s = JSON.parse(localStorage.getItem('sl-party-cfg') || 'null'); if (s && s.slots && s.slots.length === 4) CFG = s; } catch (e) {}
function saveCfg() { try { localStorage.setItem('sl-party-cfg', JSON.stringify(CFG)); } catch (e) {} }
function showSetup() { MODE = 'setup'; $('quit').classList.add('hidden'); $('touch').classList.add('hidden'); $('banner').classList.add('hidden'); M = null; PL = []; renderSetup(); }
function renderSetup() {
  const seg = (items, cur, fn) => `<span class="seg">${items.map(([v, l]) => `<button class="${v === cur ? 'on' : ''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</span>`;
  const slots = CFG.slots.slice(0, CFG.n).map((s, i) => `<div class="slot" style="--pc:${PCOL[i]}"><div class="hd"><span class="dot" style="background:${PCOL[i]};color:${PCOL[i]}"></span><input type="text" maxlength="12" value="${esc(s.name)}" oninput="cfgName(${i},this.value)" aria-label="Player ${i + 1} name">
    ${seg([['h', '🧑 Human'], ['b', '🤖 Bot']], s.bot ? 'b' : 'h', 'cfgBot' + i)}<span style="margin-left:auto;font-size:11px;color:var(--dim);font-weight:700">${s.bot ? 'Computer controlled' : 'Keys: ' + KEYLABEL[i]}</span></div>
    <div class="races">${Object.entries(RACES).map(([k, r]) => `<button class="race ${s.race === k ? 'on' : ''}" onclick="cfgRace(${i},'${k}')"><div class="e">${r.emoji}</div><div class="n">${r.name}</div><div class="tg">${r.tag}</div></button>`).join('')}</div>
    <div class="abil"><b>${RACES[s.race].ab}</b> — ${RACES[s.race].abd}</div></div>`).join('');
  const hum = CFG.slots.slice(0, CFG.n).map((s, i) => !s.bot ? `<div><span class="dot" style="display:inline-block;background:${PCOL[i]};color:${PCOL[i]}"></span> ${esc(s.name)}: <kbd>${KEYLABEL[i]}</kbd></div>` : '').join('');
  const MI = { classic: '🏰', chaos: '🌪️', speed: '⚡' };
  ovOpen(`<div class="hero"><div class="crown">👑</div><h1>Save the Princess</h1></div><div class="sub">Win mini-games to cross the map, sabotage your rivals and rescue the princess first!</div>
    <div class="row" style="margin-top:2px;align-items:center"><span class="lab">Players</span>${seg([[2, '2'], [3, '3'], [4, '4']], CFG.n, 'cfgN')}<span class="lab" style="margin-left:10px">Bots</span>${seg([['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']], CFG.diff, 'cfgDiff')}<span class="lab" style="margin-left:10px">Isekai skills</span>${seg([['on', '🌌 On'], ['off', 'Off']], CFG.skills === false ? 'off' : 'on', 'cfgSkills')}</div>
    ${slots}
    <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button class="mode ${CFG.mode === k ? 'on' : ''}" onclick="cfgMode('${k}')"><div class="mi">${MI[k] || '🎲'}</div><div class="mn">${m.name}</div></button>`).join('')}</div><div class="sub" style="margin:8px 0 0">${MODES[CFG.mode].desc}</div>
    <div class="keys">${hum || '🤖 All bots — sit back and watch them race for the princess!'}${COARSE ? '<div>📱 Touch: Player 1 uses the on-screen pad.</div>' : ''}</div>
    <div class="row sticky"><button class="btn go" onclick="startMatch()">⚔️ Start the adventure</button><button class="btn dim" onclick="howTo()">How to play</button></div>`, 700);
}
function cfgN(v) { CFG.n = +v; saveCfg(); renderSetup(); }
function cfgDiff(v) { CFG.diff = v; saveCfg(); renderSetup(); }
function cfgSkills(v) { CFG.skills = v === 'on'; saveCfg(); renderSetup(); }
function cfgMode(v) { CFG.mode = v; saveCfg(); renderSetup(); }
function cfgName(i, v) { CFG.slots[i].name = v; saveCfg(); }
function cfgRace(i, v) { CFG.slots[i].race = v; saveCfg(); renderSetup(); }
[0, 1, 2, 3].forEach(i => { window['cfgBot' + i] = v => { CFG.slots[i].bot = v === 'b'; saveCfg(); renderSetup(); }; });
// the seg buttons call cfgBot<i>; they are generated with the slot index appended below
function howTo() {
  ovOpen(`<h2>How to play</h2><div class="list" style="text-align:left;font-size:13px;line-height:1.5">
   <div class="item" style="cursor:default"><span class="ic">🗺️</span><span><div class="tt">Cross the map</div><div class="ds">Every round is a mini-game. Finish high to move forward, finish last and you may slide back. At the Crossroads pick a route: short and dangerous, or long and safe.</div></span></div>
   <div class="item" style="cursor:default"><span class="ic">🃏</span><span><div class="tt">Cards, gold and shops</div><div class="ds">Win gold and cards, then play Tornado, Swap, Freeze, Reverse and more on your rivals (max 3 cards). Spend gold at the Magic River Bazaar.</div></span></div>
   <div class="item" style="cursor:default"><span class="ic">👾</span><span><div class="tt">Bosses</div><div class="ds">Standing on a boss space triggers a co-op fight. Everybody fights together — but the top damage dealer gets the bonus.</div></span></div>
   <div class="item" style="cursor:default"><span class="ic">🏰</span><span><div class="tt">The Dark Castle</div><div class="ds">Reaching the castle is not enough! Clear every trial — Gate, Dungeon, Dragon, Tower, Princess Chamber — by finishing top of the mini-games. First to finish rescues the princess. If nobody does before the last round, the dragon wins.</div></span></div>
   <div class="item" style="cursor:default"><span class="ic">🌌</span><span><div class="tt">Isekai cheat skills</div><div class="ds">You're reincarnated with a random skill — Time Stop, Hero Awakening, Chaos Hex and more (rarer = stronger). Press your <b>Power key</b> during a challenge to unleash it. Skills cost ⚡ mana: you start with 2 and gain 1 each round.</div></span></div>
   <div class="item" style="cursor:default"><span class="ic">🐍</span><span><div class="tt">Snakes, ladders &amp; shrines</div><div class="ds">🪜 Ladder +2 · 🐍 Snake −2 · 🔄 Swap portal trades places · 💣 Mine costs gold and freezes you · ⛩️ Shrine refills mana (and may re-roll your skill).</div></span></div>
   <div class="item" style="cursor:default"><span class="ic">⌨️</span><span><div class="tt">Controls</div><div class="ds">Every mini-game uses just four direction keys and one action key per player. P1: ${KEYLABEL[0]} (power ${POWLABEL[0]}) · P2: ${KEYLABEL[1]} (power ${POWLABEL[1]}) · P3: ${KEYLABEL[2]} (power ${POWLABEL[2]}) · P4: ${KEYLABEL[3]} (power ${POWLABEL[3]}). Phones: P1 uses the on-screen pad; chess is click/tap.</div></span></div></div>
   <div class="row"><button class="btn go" onclick="renderSetup()">Got it</button></div>`, 680);
}
async function startMatch(cfg) {
  cfg = cfg || CFG; if (!cfg.slots.slice(0, cfg.n).length) return;
  cfg.slots.forEach((s, i) => { if (!String(s.name).trim()) s.name = s.bot ? BOT_NAMES[i] : 'Player ' + (i + 1); });
  saveCfg(); ovClose(); $('ov').classList.remove('end'); audioInit();
  setupMatch(JSON.parse(JSON.stringify(cfg))); await playMatch();
}
async function quitMatch() {
  if (MODE === 'game' && CUR) { /* keep playing under the dialog */ }
  const v = await ask(`<h2>Quit this adventure?</h2><div class="sub">Your progress will be lost.</div><div class="row"><button class="btn dim" data-v="no">Keep playing</button><button class="btn go" data-v="yes">Quit</button></div>`, 420);
  if (v === 'yes') location.reload(); else if (MODE === 'setup') renderSetup();
}

/* ---------- boot ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  c.setTransform(SC, 0, 0, SC, 0, 0); c.clearRect(0, 0, W, H);
  try { if (MODE === 'game' && CUR) gameFrame(dt); else if (MODE === 'end' && END) drawEnd(dt); else { c.save(); if (MSHK > 0.2) { c.translate(rr(-MSHK, MSHK), rr(-MSHK, MSHK)); MSHK *= Math.pow(0.001, dt); } else MSHK = 0; drawMap(dt); c.restore(); } } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
fitCanvas();
try { ['16px "Press Start 2P"', '700 14px "Silkscreen"', '800 14px "Plus Jakarta Sans"'].forEach(f => document.fonts.load(f)); } catch (e) {}
$('snd').textContent = audioOn ? '🔊' : '🔇';
window.__party = { get M() { return M; }, get CFG() { return CFG; }, GAMES, BOSS_DEF, NODES, runGame, makeCtx, stepGame, finishResult, clearEdges, startMatch, showSetup, setFast(v) { FAST = v; }, get MODE() { return MODE; }, get CUR() { return CUR; }, INP, drawMap, SKILLS, rollSkill, usePower, summonPhase, splash };
showSetup();
requestAnimationFrame(frame);

</script>
