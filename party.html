<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Save the Princess — Yutfi MiniGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@500;700;800&family=Press+Start+2P&family=Silkscreen:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root{--gold:#fbbf24;--ink:#0a0710;--panel:#17102a;--line:#ffffff1f;--txt:#ece8f7;--dim:#a8a1c2;--vio:#8b5cf6;--pink:#f472b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07040d;color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 70% 55% at 50% 0%,#33195a 0%,#10081f 55%,#05030a 100%)}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1.4px);background-size:34px 34px;opacity:.5;pointer-events:none}
#cv{position:relative;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;display:block;background:#12091f;box-shadow:0 0 0 1px #ffffff1c,0 0 0 4px #0b0616,0 0 0 5px #fbbf2444,0 30px 90px #000;touch-action:none;border-radius:6px}
@media (max-width:900px),(max-height:520px){#cv{border-radius:0;box-shadow:none}}
.hidden{display:none!important}
#top{position:fixed;left:8px;top:5px;z-index:30;display:flex;gap:6px}
#top .chip{border:1px solid #ffffff2a;background:rgba(18,11,34,.78);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px #0008;font-family:inherit;line-height:1.2}
#top .chip:hover{background:rgba(60,36,110,.9);border-color:#fbbf2488}
@media (max-width:900px){#top .lbl{display:none}#top .chip{padding:6px 10px;font-size:13px}}
#ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(ellipse at 50% 30%,rgba(40,20,80,.72),rgba(4,2,10,.9));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto}
.card{position:relative;width:min(100%,var(--w,640px));max-height:100%;overflow:auto;border-radius:24px;padding:22px 20px;background:linear-gradient(180deg,rgba(46,26,86,.96),rgba(20,11,40,.97));border:1px solid #ffffff2e;box-shadow:0 30px 90px #000d,inset 0 1px 0 #ffffff26,0 0 0 1px #0008;animation:pop .28s cubic-bezier(.2,1.2,.3,1)}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,transparent,#fbbf24,transparent);border-radius:2px;opacity:.9}
.card::-webkit-scrollbar{width:8px}.card::-webkit-scrollbar-thumb{background:#ffffff30;border-radius:8px}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
h1,h2,h3{font-family:'Cinzel',Georgia,serif;margin:0;color:#fff;text-align:center}
h1{font-size:clamp(26px,5vw,42px);letter-spacing:.02em;background:linear-gradient(180deg,#fff7d6,#fbbf24 55%,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 22px #fb923c66)}
h2{font-size:clamp(20px,3.6vw,28px);text-shadow:0 2px 0 #000a}
.sub{color:var(--dim);text-align:center;font-size:13px;margin:6px 0 12px;line-height:1.45}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#5b3fa8,#3b2a66);box-shadow:0 4px 0 #1a1033,0 8px 18px #0006,inset 0 1px 0 #ffffff30;font-family:inherit;transition:transform .08s,filter .15s;letter-spacing:.01em}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a1033}
.btn.go{position:relative;overflow:hidden;background:linear-gradient(180deg,#fef08a,#f59e0b 60%,#ea580c);color:#2a1300;box-shadow:0 4px 0 #92400e,0 10px 24px #f59e0b44,inset 0 1px 0 #fff9}
.btn.go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#fff8,transparent);animation:shine 2.8s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.dim{background:linear-gradient(180deg,#2b1f47,#211738);color:#cdc5e6}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#120a22}
.seg button{border:0;background:transparent;color:#cdc5e6;padding:8px 13px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.seg button:hover{background:#ffffff14}
.seg button.on{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#2a1300}
.slot{border:1px solid var(--line);border-radius:18px;padding:12px;background:linear-gradient(180deg,#24173f,#1a1030);margin-top:10px;display:grid;gap:10px;position:relative;overflow:hidden}
.slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,#fff)}
.slot .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff6,0 0 10px currentColor}
.slot input[type=text]{background:#0d0719;border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 11px;font-weight:800;width:140px;font-family:inherit;font-size:13px}
.slot input[type=text]:focus{outline:2px solid #fbbf2488}
.races{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.race{border:1px solid var(--line);border-radius:14px;padding:8px 4px 7px;background:#120a22;color:#fff;cursor:pointer;text-align:center;font-family:inherit;transition:transform .12s,background .15s,box-shadow .15s}
.race:hover{transform:translateY(-2px);background:#201437}
.race .e{font-size:30px;line-height:1.15;filter:drop-shadow(0 3px 3px #0008)}.race .n{font-size:11px;font-weight:800}.race .tg{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.race.on{background:linear-gradient(180deg,#4a2f8a,#2d1b57);box-shadow:0 0 0 2px #fbbf24,0 6px 18px #fbbf2433}
.abil{font-size:11.5px;color:var(--dim);line-height:1.4;min-height:30px}
.abil b{color:var(--gold)}
.big{font-size:clamp(44px,12vw,70px);text-align:center;line-height:1;filter:drop-shadow(0 6px 10px #000a)}
.list{display:grid;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:linear-gradient(180deg,#2a1b48,#1f1337);border:1px solid var(--line);text-align:left;color:#fff;cursor:pointer;font-family:inherit;width:100%;transition:transform .1s,border-color .15s}
.item:hover:not([disabled]){border-color:#fbbf2488;transform:translateY(-1px)}
.item[disabled]{opacity:.45;cursor:default}
.item .ic{font-size:28px;width:38px;text-align:center;filter:drop-shadow(0 2px 3px #0008)}
.item .tt{font-weight:800;font-size:14px}.item .ds{font-size:11.5px;color:var(--dim)}
.item .rt{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#ffffff1a;color:#e9d5ff}
.res{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;background:linear-gradient(90deg,#2a1b48,#1f1337);margin-top:7px;border:1px solid #ffffff10}
.res:first-of-type{border-color:#fbbf2466}
.res .pl{font-weight:800;flex:1;text-align:left}.res .md{font-size:22px;width:34px;text-align:center}
.res .mv{font-weight:800;min-width:60px;text-align:right}
.up{color:#86efac}.down{color:#fca5a5}.gd{color:var(--gold)}
@media (max-width:900px){#banner{top:44px}}
#banner{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:35;padding:10px 20px;border-radius:16px;background:rgba(18,10,36,.92);border:1px solid #fbbf2477;font-weight:800;font-size:15px;max-width:92vw;text-align:center;box-shadow:0 12px 40px #000b,0 0 24px #fbbf2422;animation:pop .22s ease-out;backdrop-filter:blur(8px)}
.keys{font-size:11.5px;color:var(--dim);line-height:1.7;text-align:center;margin-top:10px}
.keys kbd{background:#0d0719;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:#fff;font-weight:800;font-family:inherit}
.conf{position:fixed;inset:0;pointer-events:none;z-index:36}
#ov.end{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-end;padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px}.chips .chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;border:1.5px solid #fff4;background:#ffffff10}
.card .row.sticky{position:sticky;bottom:-22px;background:linear-gradient(180deg,transparent,#140b28 42%);padding:12px 0 4px;margin-top:6px}
#ov.end .card{background:linear-gradient(180deg,rgba(46,26,86,.92),rgba(20,11,40,.94))}
.hero{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:4px}
.hero .crown{font-size:44px;filter:drop-shadow(0 6px 10px #0009);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.lab{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c4b5fd;align-self:center}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.mode{border:1px solid var(--line);border-radius:14px;padding:10px 6px;background:#150c29;color:#fff;cursor:pointer;font-family:inherit;text-align:center;transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode .mi{font-size:24px}.mode .mn{font-weight:800;font-size:12.5px;margin-top:2px}
.mode.on{background:linear-gradient(180deg,#4a2f8a,#2d1b57);box-shadow:0 0 0 2px #fbbf24}

#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:45;pointer-events:none}
#splash.hidden{display:none}
#splash::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 45%,transparent),transparent 62%);animation:spFlash 1.15s ease both}
#splash .sp{position:relative;display:flex;flex-direction:column;align-items:center;animation:spPop 1.15s cubic-bezier(.2,1.5,.3,1) both;filter:drop-shadow(0 10px 30px #000b)}
.sp-ic{font-size:min(28vh,180px);line-height:1;animation:spWob .45s ease-in-out 3}
.sp-t{font-family:'Press Start 2P',monospace;font-size:clamp(16px,5vh,36px);color:#fff;margin-top:8px;letter-spacing:.04em;text-shadow:0 4px 0 var(--c),0 0 26px var(--c);-webkit-text-stroke:2px #1e1b4b;paint-order:stroke fill;text-align:center;padding:0 12px}
@keyframes spPop{0%{transform:scale(.15) rotate(-14deg);opacity:0}25%{transform:scale(1.18) rotate(3deg);opacity:1}40%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:scale(1.3);opacity:0}}
@keyframes spWob{50%{transform:rotate(9deg) scale(1.1)}}
@keyframes spFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.gacha{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0;perspective:800px}
.skc{width:152px;border-radius:16px;padding:11px 9px;background:linear-gradient(160deg,#2a1e52,#120b26);border:2px solid var(--rc);box-shadow:0 0 0 1px #0008,0 0 22px -4px var(--rc);text-align:center;opacity:0;animation:skIn .75s cubic-bezier(.2,1.4,.3,1) forwards;animation-delay:var(--d)}
.skc .who{font-size:11.5px;font-weight:800;margin-bottom:3px}
.skc .rar{font-size:8.5px;letter-spacing:.16em;color:var(--rc);font-weight:800}
.skc .ico{font-size:42px;margin:3px 0;animation:skPulse 2.2s ease-in-out infinite}
.skc .nm{font-weight:800;font-size:13px}
.skc .ds{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.35}
.skc.ssr{background:linear-gradient(160deg,#5b3a05,#1c1204 70%);animation:skIn .75s cubic-bezier(.2,1.4,.3,1) forwards,skGlow 1.6s ease-in-out .9s infinite;animation-delay:var(--d),0s}
@keyframes skIn{0%{opacity:0;transform:translateY(34px) rotateY(100deg) scale(.7)}100%{opacity:1;transform:none}}
@keyframes skPulse{50%{transform:scale(1.14) rotate(-4deg)}}
@keyframes skGlow{50%{box-shadow:0 0 0 1px #0008,0 0 44px 4px var(--rc)}}
.gacha-hd{display:flex;justify-content:center}
.circle{position:relative;width:128px;height:128px;margin:6px auto 2px;display:flex;align-items:center;justify-content:center;font-size:52px}
.circle::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px dashed #c084fc;box-shadow:0 0 34px #a855f7aa inset,0 0 26px #a855f788;animation:spin 7s linear infinite}
.circle::after{content:'';position:absolute;inset:16px;border-radius:50%;border:2px solid #67e8f9aa;animation:spin 4s linear infinite reverse}
.circle span{position:relative;animation:skPulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{animation:cardIn .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardIn{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:none}}
.item,.res{animation:itemIn .4s ease both}
.res:nth-child(2){animation-delay:.08s}.res:nth-child(3){animation-delay:.16s}.res:nth-child(4){animation-delay:.24s}.res:nth-child(5){animation-delay:.32s}
@keyframes itemIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
.hero .crown{animation:crown 2.4s ease-in-out infinite}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
/* ---------- touch controls: analog joystick + context action button ---------- */
#touch{position:fixed;left:0;right:0;bottom:0;z-index:25;height:min(54vh,310px);pointer-events:none;--jr:clamp(46px,15vh,66px)}
#joyzone{position:absolute;left:0;bottom:0;width:50%;height:100%;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none}
#joy{position:absolute;left:calc(max(18px,env(safe-area-inset-left)) + var(--jr));top:calc(100% - 22px - var(--jr) - env(safe-area-inset-bottom));width:calc(var(--jr)*2);height:calc(var(--jr)*2);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.18),rgba(255,255,255,.06) 62%,rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.36);box-shadow:0 0 0 6px rgba(255,255,255,.06),inset 0 0 22px rgba(0,0,0,.35),0 8px 26px #0007;opacity:.66;transition:opacity .15s}
#joy::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(253,224,71,.5);animation:joyPulse 2.2s ease-out infinite}
#joy.on{opacity:1}#joy.on::before{animation:none;opacity:0}
@keyframes joyPulse{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.28);opacity:0}}
#joy i{position:absolute;font-style:normal;color:rgba(255,255,255,.42);font-size:calc(var(--jr)*.27);line-height:1;transition:color .08s,scale .08s;text-shadow:0 1px 3px #000}
#joy i.u{top:6%;left:50%;margin-left:-.5em}#joy i.d{bottom:6%;left:50%;margin-left:-.5em}#joy i.l{left:7%;top:50%;margin-top:-.5em}#joy i.r{right:7%;top:50%;margin-top:-.5em}
#joy.u i.u,#joy.d i.d,#joy.l i.l,#joy.r i.r{color:#fde047;scale:1.35}
#joyknob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e2d6ff 35%,#8b5cf6 92%);box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 18px #0008;transition:transform .06s}
#joy:not(.on) #joyknob{transition:transform .2s cubic-bezier(.2,1.5,.4,1)}
#touch .rt{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
#touch .acts{display:flex;align-items:flex-end;gap:12px}
#touch button{border:2px solid rgba(255,255,255,.5);color:#fff;font-family:inherit;font-weight:800;touch-action:none;pointer-events:auto;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .06s,filter .12s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1;padding:0;-webkit-user-select:none;user-select:none}
#touch button .al{letter-spacing:.08em}
#touch .act{width:clamp(78px,22vh,112px);height:clamp(78px,22vh,112px);border-radius:50%;background:radial-gradient(circle at 32% 26%,#fecdd3,#f43f5e 70%,#9f1239);box-shadow:0 6px 0 #4c0519,0 10px 24px #000a,inset 0 2px 0 #fff6}
#touch .act .ai{font-size:clamp(26px,8vh,38px)}#touch .act .al{font-size:clamp(11px,3vh,15px)}
#touch .alt{width:clamp(58px,16vh,82px);height:clamp(58px,16vh,82px);border-radius:50%;background:radial-gradient(circle at 32% 26%,#bfdbfe,#3b82f6 70%,#1e3a8a);box-shadow:0 5px 0 #172554,0 8px 18px #000a,inset 0 2px 0 #fff6}
#touch .alt .ai{font-size:clamp(20px,6vh,28px)}#touch .alt .al{font-size:clamp(9px,2.4vh,12px)}
#touch .pow{width:clamp(48px,14vh,66px);height:clamp(48px,14vh,66px);border-radius:50%;font-size:22px;background:radial-gradient(circle at 30% 25%,#fef08a,#d97706aa);border-color:#fde68a}
#touch .pow small{font-size:8px;letter-spacing:.06em}
#touch .act.on,#touch .alt.on,#touch .pow.on,#dpad button.on{transform:translateY(4px) scale(.95);filter:brightness(1.25)}
#touch .act.off{filter:grayscale(.85) brightness(.7)}
#dpad{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,var(--db));grid-template-rows:repeat(3,var(--db));gap:6px;--db:clamp(48px,14vh,74px);pointer-events:none}
#dpad button{border-radius:20px;font-size:calc(var(--db)*.4);background:radial-gradient(circle at 30% 25%,#ffffff40,#ffffff12);box-shadow:0 4px 0 #0006,inset 0 1px 0 #fff5}
#touch[data-mv="none"] #joyzone,#touch[data-mv="dpad"] #joyzone,#touch[data-mv="lr"] #joyzone{display:none}
#touch:not([data-mv="dpad"]):not([data-mv="lr"]) #dpad{display:none}
#touch[data-mv="lr"] #dpad .v{visibility:hidden}
@media (orientation:portrait){
  #stage{align-items:flex-start}
  #cv{width:100vw;border-radius:0;box-shadow:none}
  #touch{height:max(230px,calc(100dvh - 56.25vw - 4px));--jr:clamp(54px,16vw,72px)}
  #joyzone{width:58%}
  #touch .act{width:clamp(92px,27vw,120px);height:clamp(92px,27vw,120px)}#touch .act .ai{font-size:34px}#touch .act .al{font-size:14px}
  #touch .alt{width:clamp(66px,19vw,84px);height:clamp(66px,19vw,84px)}
  #dpad{--db:clamp(52px,16vw,76px)}
}
#rotHint{display:none}
@media (orientation:portrait) and (max-width:700px){#rotHint{display:flex;align-items:center;gap:8px;position:fixed;left:50%;transform:translateX(-50%);top:calc(56.25vw + 8px);z-index:24;padding:6px 8px 6px 14px;border-radius:999px;background:rgba(18,11,34,.85);border:1px solid #fbbf2455;font-weight:800;font-size:12px;color:#fde68a;white-space:nowrap;backdrop-filter:blur(8px)}#rotHint button{border:0;background:#ffffff1f;color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer}}
#top .chip.off{opacity:.45}
/* ---------- quest transition wipe ---------- */
#wipe{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
#wipe .pn{position:absolute;top:-10%;bottom:-10%;width:62%;box-shadow:0 0 60px #000}
#wipe .pl{left:-70%;transform:skewX(-12deg);background:linear-gradient(180deg,#5b21b6,#1e1b4b);animation:wipeL .68s cubic-bezier(.65,0,.35,1) forwards}
#wipe .pr{right:-70%;transform:skewX(-12deg);background:linear-gradient(180deg,#be185d,#4c1d95);animation:wipeR .68s cubic-bezier(.65,0,.35,1) forwards}
@keyframes wipeL{0%{left:-70%}45%,60%{left:-12%}100%{left:-72%}}
@keyframes wipeR{0%{right:-70%}45%,60%{right:-12%}100%{right:-72%}}
#wipe .wi{position:relative;z-index:2;text-align:center;animation:wipeI .68s ease forwards}
#wipe .wic{font-size:min(22vh,110px);line-height:1;filter:drop-shadow(0 8px 14px #000a)}

<script>
'use strict';
/* ============================================================
   SAVE THE PRINCESS — a local party game (2–4 players, bots fill in)
   Part 1: helpers, input, audio, mini-game runtime
   ============================================================ */
const $ = id => document.getElementById(id);
const W = 960, H = 540;
const cv = $('cv'), c = cv.getContext('2d');
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const RACES = {
  human:  { name: 'Human',  emoji: '🧑', tag: 'Balanced', ab: 'Second Chance',      abd: 'Cancels your first setback (a move backwards).' },
  angel:  { name: 'Angel',  emoji: '👼', tag: 'Airborne', ab: 'Divine Protection',  abd: 'Blocks the first sabotage aimed at you. Floaty jumps.' },
  devil:  { name: 'Devil',  emoji: '😈', tag: 'Brawler',  ab: 'Infernal Strength',  abd: 'Your first win moves you 1 extra space. Pushes harder.' },
  wizard: { name: 'Wizard', emoji: '🧙', tag: 'Trickster', ab: 'Magical Trick',     abd: 'Reflects the first sabotage back at whoever sent it.' }
};
const PCOL = ['#ef4444', '#3b82f6', '#22c55e', '#eab308'];

/* ---------- crisp (HiDPI) canvas ---------- */
let SC = 1;
function fitCanvas() {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3), px = Math.min(Math.round(r.width * dpr), 2560), w = Math.max(960, px);
  if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * 9 / 16); }
  SC = cv.width / W;
}
window.addEventListener('resize', fitCanvas); window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(cv);

/* ---------- drawing helpers ---------- */
const PXF = "'Press Start 2P','Silkscreen','Courier New',monospace";
function txt(s, x, y, size = 20, col = '#fff', align = 'center', stroke) {
  c.font = `800 ${size}px 'Plus Jakarta Sans',system-ui,sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineWidth = Math.max(3, size / 6); c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
// chunky pixel-font text with a hard drop shadow (arcade look) — used for counters, countdowns and callouts
function ptxt(s, x, y, size = 16, col = '#fff', align = 'center', sh = '#000') {
  c.font = `${size}px ${PXF}`; c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  const o = Math.max(2, Math.round(size / 8));
  if (sh) { c.fillStyle = sh; c.fillText(s, x + o, y + o); c.lineWidth = Math.max(2, size / 5); c.strokeStyle = sh; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
function emo(e, x, y, size = 30, alpha = 1) {
  c.save(); c.globalAlpha = alpha; c.font = `${size}px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  if (size >= 22) { c.shadowColor = 'rgba(0,0,0,.38)'; c.shadowBlur = size * 0.2; c.shadowOffsetY = size * 0.07; }
  c.fillText(e, x, y); c.restore();
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  c.beginPath(); c.roundRect(x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 2) { c.beginPath(); c.arc(x, y, r, 0, 7); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); } }
function shadow(x, y, rx, ry = rx * 0.3, a = 0.3) { c.save(); c.globalAlpha = a; c.fillStyle = '#000'; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill(); c.restore(); }
function sky(c1, c2) { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); c.fillStyle = g; c.fillRect(0, 0, W, H); }
function vgrad(x, y, w, h, c1, c2) { const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, c1); g.addColorStop(1, c2); c.fillStyle = g; c.fillRect(x, y, w, h); }
// frosted "glass" panel with a coloured accent edge
function glass(x, y, w, h, r = 14, accent = '#ffffff30', fill = 'rgba(14,8,28,.72)') {
  c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 16; c.shadowOffsetY = 5; rrect(x, y, w, h, r, fill); c.restore();
  const g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(255,255,255,0)'); rrect(x, y, w, h, r, g);
  rrect(x + 0.5, y + 0.5, w - 1, h - 1, r, null, accent, 1.5);
}
// soft pixel-snapped clouds drifting across a band
function clouds(t, y0, n = 5, col = 'rgba(255,255,255,.85)', sp = 12, sc = 1) {
  for (let k = 0; k < n; k++) { const w = (70 + (k * 37) % 50) * sc, x = ((k * 233 + t * sp * (0.6 + (k % 3) * 0.3)) % (W + 240)) - 120, y = y0 + ((k * 61) % 70) * sc;
    c.fillStyle = col; c.beginPath(); c.ellipse(x, y, w * 0.5, w * 0.16, 0, 0, 7); c.ellipse(x - w * 0.22, y - w * 0.09, w * 0.26, w * 0.14, 0, 0, 7); c.ellipse(x + w * 0.16, y - w * 0.12, w * 0.3, w * 0.16, 0, 0, 7); c.fill(); }
}
// layered rolling hills with parallax (cam = world scroll, f = parallax factor)
function hills(cam, base, amp, col, wl = 260, f = 0.3, ph = 0) {
  c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) c.lineTo(x, base - amp * (0.55 + 0.45 * Math.sin((x + cam * f) / wl * 6.283 + ph)) - amp * 0.3 * Math.sin((x + cam * f) / (wl * 0.43) * 6.283 + ph * 2));
  c.lineTo(W, H); c.fill();
}
function stars(t, n = 40, a = 0.7) { for (let k = 0; k < n; k++) { const tw = 0.5 + 0.5 * Math.sin(t * 2 + k * 1.7); c.fillStyle = `rgba(255,255,255,${a * (0.35 + 0.65 * tw)})`; const s = k % 5 ? 1.4 : 2.4; c.fillRect((k * 197) % W, (k * 83) % (H * 0.7), s, s); } }
let VIG = null;
function vignette(a = 0.5) {
  if (!VIG) { VIG = c.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.0); VIG.addColorStop(0, 'rgba(0,0,0,0)'); VIG.addColorStop(1, 'rgba(0,0,0,.6)'); }
  c.save(); c.globalAlpha = a / 0.5; c.fillStyle = VIG; c.fillRect(0, 0, W, H); c.restore();
}
// particle / ring / slash system shared by every scene
const FXP = [], FXR = [], FXS = [];
let SHK = 0, HSTOP = 0;
function camShake(a = 6) { SHK = Math.max(SHK, a); }
function hitstop(t = 0.06) { HSTOP = Math.max(HSTOP, t); }
function burst(x, y, col = '#fde047', n = 14, sp = 160, life = 0.7, g = 260) { for (let k = 0; k < n; k++) { const a = Math.random() * 6.283, v = sp * (0.35 + Math.random() * 0.65); FXP.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.25, col, life, max: life, s: 2 + Math.random() * 3, g }); } }
function spark(x, y, col = '#fff', n = 10, sp = 300, life = 0.32) { for (let k = 0; k < n; k++) { const a = Math.random() * 6.283, v = sp * (0.4 + Math.random() * 0.6); FXP.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col, life, max: life * (0.6 + Math.random() * 0.4), s: 2 + Math.random() * 2, g: 0, add: 1, line: 1 }); } }
function dust(x, y, n = 5, col = 'rgba(235,225,210,.55)') { for (let k = 0; k < n; k++) FXP.push({ x: x + rr(-8, 8), y, vx: rr(-45, 45), vy: rr(-40, -8), col, life: 0.5, max: 0.5 + Math.random() * 0.2, s: 4 + Math.random() * 5, g: -10, circ: 1, grow: 1 }); }
function ember(x, y, n = 6, col = '#fb923c') { for (let k = 0; k < n; k++) FXP.push({ x: x + rr(-10, 10), y, vx: rr(-30, 30), vy: rr(-120, -50), col, life: 0.8, max: 0.8 + Math.random() * 0.4, s: 2 + Math.random() * 2.5, g: -20, add: 1, circ: 1 }); }
function confetti(x, y, n = 40) { const cs = ['#f87171', '#fbbf24', '#4ade80', '#60a5fa', '#c084fc', '#f472b6']; for (let k = 0; k < n; k++) { const a = -Math.PI / 2 + rr(-1.1, 1.1), v = rr(180, 520); FXP.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col: cs[k % 6], life: 1.6, max: 1.6 + Math.random(), s: 4 + Math.random() * 4, g: 520, conf: 1 }); } }
function ring(x, y, col = '#fff', r1 = 70, life = 0.4, lw = 5) { FXR.push({ x, y, col, r1, life, max: life, lw }); }
function slash(x, y, dir = 1, r = 96, col = '#e0f2fe', life = 0.26, a0 = -1.95, a1 = 0.95) { FXS.push({ x, y, dir, r, col, life, max: life, a0, a1 }); }
function drawFX(dt) {
  for (let i = FXS.length - 1; i >= 0; i--) { const q = FXS[i]; q.life -= dt; if (q.life <= 0) { FXS.splice(i, 1); continue; }
    const p = 1 - q.life / q.max, sw = Math.min(1, p * 1.7), head = q.a0 + (q.a1 - q.a0) * sw, tail = q.a0 + (q.a1 - q.a0) * Math.max(0, sw - 0.65 - p * 0.35);
    c.save(); c.translate(q.x, q.y); c.scale(q.dir, 1); c.globalAlpha = Math.min(1, q.life / q.max * 1.8); c.globalCompositeOperation = 'lighter';
    c.beginPath(); c.arc(0, 0, q.r, tail, head); c.arc(-q.r * 0.12, 0, q.r * 0.7, head, tail, true); c.closePath(); c.fillStyle = q.col; c.fill();
    c.lineWidth = 3; c.strokeStyle = '#fff'; c.beginPath(); c.arc(0, 0, q.r, Math.max(tail, head - 0.9), head); c.stroke(); c.restore(); }
  for (let i = FXR.length - 1; i >= 0; i--) { const q = FXR[i]; q.life -= dt; if (q.life <= 0) { FXR.splice(i, 1); continue; }
    const p = 1 - q.life / q.max, r = q.r1 * (1 - Math.pow(1 - p, 2)); c.save(); c.globalAlpha = (1 - p) * 0.9; c.lineWidth = q.lw * (1 - p) + 1; c.strokeStyle = q.col; c.beginPath(); c.arc(q.x, q.y, r, 0, 7); c.stroke(); c.restore(); }
  for (let i = FXP.length - 1; i >= 0; i--) { const q = FXP[i]; q.life -= dt; if (q.life <= 0) { FXP.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; if (q.conf) q.vx *= 0.985;
    const a = Math.min(1, q.life / q.max * 1.6); c.globalAlpha = a; c.fillStyle = q.col;
    if (q.add) c.globalCompositeOperation = 'lighter';
    if (q.line) { c.strokeStyle = q.col; c.lineWidth = q.s * 0.7; c.beginPath(); c.moveTo(q.x, q.y); c.lineTo(q.x - q.vx * 0.05, q.y - q.vy * 0.05); c.stroke(); }
    else if (q.circ) { const r = q.s * (q.grow ? 1 + (1 - a) * 1.6 : 1) / 2; c.beginPath(); c.arc(q.x, q.y, r, 0, 7); c.fill(); }
    else if (q.conf) { c.save(); c.translate(q.x, q.y); c.rotate(q.life * 9 + q.s); c.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); c.restore(); }
    else c.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
    c.globalCompositeOperation = 'source-over'; }
  c.globalAlpha = 1;
}
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- audio: sound effects + uplifting adventure songs (all generated live with Tone.js, no files) ---------- */
let audioOn = true, musicOn = true, sfxSynth = null, sqS = null, bellS = null, noiseS = null, whooshS = null, kickS = null, metalS = null, mus = null, musTimer = 0, audioReady = false;
try { if (localStorage.getItem('sl-party-audio') === 'off') audioOn = false; if (localStorage.getItem('sl-party-music') === 'off') musicOn = false; } catch (e) {}
function audioInit() {
  if (audioReady || typeof Tone === 'undefined') return;
  audioReady = true;
  const mk = f => { try { return f(); } catch (e) { return null; } };
  sfxSynth = mk(() => new Tone.PolySynth(Tone.Synth, { volume: -9, oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.14, sustain: 0.05, release: 0.2 } }).toDestination());
  sqS = mk(() => new Tone.PolySynth(Tone.Synth, { volume: -21, oscillator: { type: 'square' }, envelope: { attack: 0.002, decay: 0.09, sustain: 0, release: 0.08 } }).toDestination());
  bellS = mk(() => new Tone.PolySynth(Tone.FMSynth, { volume: -19, harmonicity: 3.01, modulationIndex: 8, envelope: { attack: 0.002, decay: 0.5, sustain: 0, release: 0.5 }, modulationEnvelope: { attack: 0.002, decay: 0.3, sustain: 0, release: 0.3 } }).toDestination());
  noiseS = mk(() => new Tone.NoiseSynth({ volume: -14, noise: { type: 'brown' }, envelope: { attack: 0.005, decay: 0.3, sustain: 0 } }).toDestination());
  whooshS = mk(() => new Tone.NoiseSynth({ volume: -20, noise: { type: 'pink' }, envelope: { attack: 0.04, decay: 0.22, sustain: 0 } }).connect(new Tone.Filter(1700, 'bandpass').toDestination()));
  kickS = mk(() => new Tone.MembraneSynth({ volume: -9, pitchDecay: 0.03, octaves: 3, envelope: { attack: 0.001, decay: 0.22, sustain: 0, release: 0.1 } }).toDestination());
  metalS = mk(() => new Tone.MetalSynth({ volume: -30, frequency: 400, envelope: { attack: 0.001, decay: 0.28, release: 0.1 }, harmonicity: 5.1, modulationIndex: 24, resonance: 3500, octaves: 1.2 }).toDestination());
  try { Tone.start(); } catch (e) {}
  buildMus();
}
const lastSfx = {};
function sfx(n, x) {
  if (!audioOn || !sfxSynth || Tone.context.state !== 'running') return;
  const now = performance.now(); if (now - (lastSfx[n] || 0) < 35) return; lastSfx[n] = now;
  try {
    const t = Tone.now() + 0.01, s = sfxSynth;
    const q = (nn, d, dt = 0, v) => s.triggerAttackRelease(nn, d, t + dt, v);
    const sq = (nn, d, dt = 0) => sqS && sqS.triggerAttackRelease(nn, d, t + dt);
    const bl = (nn, d, dt = 0) => bellS && bellS.triggerAttackRelease(nn, d, t + dt);
    const seq = (notes, step, fn) => notes.forEach((nn, i) => fn(nn, i * step));
    switch (n) {
      case 'tick': q('C5', '32n'); break;
      case 'click': sq('A5', '64n'); sq('E6', '64n', 0.03); break;
      case 'select': sq('E6', '64n'); break;
      case 'go': q(['C5', 'G5', 'C6'], '8n'); bl('C7', '8n', 0.02); break;
      case 'hit': if (kickS) kickS.triggerAttackRelease('C2', '16n', t); q('A3', '32n'); break;
      case 'coin': bl('E6', '16n'); bl('B6', '8n', 0.07); break;
      case 'good': q(['C5', 'E5'], '16n'); break;
      case 'bad': q(['E3', 'Bb2'], '16n'); sq('E3', '8n'); break;
      case 'boom': if (noiseS) noiseS.triggerAttackRelease('8n', t); if (kickS) kickS.triggerAttackRelease('A1', '8n', t); break;
      case 'shoot': sq('G5', '64n'); sq('D5', '32n', 0.04); break;
      case 'jump': sq('E5', '64n'); sq('B5', '32n', 0.05); break;
      case 'land': if (kickS) kickS.triggerAttackRelease('E2', '32n', t); break;
      case 'swing': if (whooshS) whooshS.triggerAttackRelease('8n', t); break;
      case 'clang': if (metalS) metalS.triggerAttackRelease('16n', t); bl('C7', '8n'); break;
      case 'pop': sq('C6', '64n'); sq('G6', '64n', 0.04); break;
      case 'squish': sq('C3', '32n'); sq('G3', '32n', 0.05); break;
      case 'whoosh': if (whooshS) whooshS.triggerAttackRelease('4n', t); break;

async function sabotage(user, target, kind) {                 // returns true if it landed

  if (target.race === 'wizard' && !target.ab && user !== target) { target.ab = true; await say(`🧙 Magical Trick! ${who(target)} reflects ${CARDS[kind].icon} ${CARDS[kind].name} back at ${who(user)}!`); return sabotage(target, user, kind).then(() => false); }

    case 'curse': target.fx.curse = 1; await say(`💀 ${who(target)} is cursed: -2 spaces after the next challenge.`); break;
    case 'swap': if (!target.atCastle && !user.atCastle) { const a = [user.pos, user.trail], b = [target.pos, target.trail]; [user.pos, user.trail] = b; [target.pos, target.trail] = a; await say(`🔄 ${who(user)} and ${who(target)} swap places!`); } else await say('🔄 The swap fizzles at the castle gate…'); break;

    case 'reverse': target.fx.reverse = true; await say(`🔀 ${who(target)}'s controls will flip in the next challenge!`); break;

}
async function useCard(p, idx, target) {

function cardTargets(p, id) { return others(p).filter(o => id === 'swap' ? (!o.atCastle && !p.atCastle) : id === 'tornado' ? !o.atCastle : true); }
async function cardsPhase() {
  for (const p of M.players) {
    if (!p.cards.length) continue;
    if (p.bot) {                                              // bots: sometimes play a sensible card
      if (Math.random() > 0.5) continue;
      const leader = others(p).sort((a, b) => prog(b) - prog(a))[0];
      const opts = p.cards.map((id, i) => ({ id, i })).filter(o => !CARDS[o.id].tgt ? (o.id !== 'trap' || !p.atCastle) : cardTargets(p, o.id).length && (o.id !== 'swap' || prog(leader) > prog(p) + 1));
      if (!opts.length) continue; const o = pick(opts);
      const tg = CARDS[o.id].tgt ? (cardTargets(p, o.id).includes(leader) ? leader : pick(cardTargets(p, o.id))) : null;
      if (['shield', 'lucky', 'double'].includes(o.id) && p.fx[o.id === 'shield' ? 'shield' : o.id]) continue;
      await useCard(p, o.i, tg); continue;
    }
    const items = p.cards.map((id, i) => `<button class="item" data-v="${i}"${CARDS[id].tgt && !cardTargets(p, id).length ? ' disabled' : ''}><span class="ic">${CARDS[id].icon}</span><span><div class="tt">${CARDS[id].name}</div><div class="ds">${CARDS[id].desc}</div></span></button>`).join('');

    if (v === 'skip') continue;

      const tv = await ask(`<h2>${CARDS[id].icon} ${CARDS[id].name}</h2><div class="sub">Who is the target?</div><div class="list">${ts.map(o => `<button class="item" data-v="${o.id}"><span class="ic">${RACES[o.race].emoji}</span><span><div class="tt" style="color:${o.color}">${esc(o.name)}</div><div class="ds">${o.atCastle ? 'at the castle' : o.trail.length + ' steps along'} · 🪙${o.gold}</div></span></button>`).join('')}</div><div class="row"><button class="btn dim" data-v="no">Back</button></div>`, 520);

/* ---------- isekai summoning: every hero is reincarnated with a cheat skill ---------- */
async function summonPhase() {
  if (!M.players.some(p => p.cheat) || FAST === true) return;
  if (M.players.some(p => !p.bot)) {
    await ask(`<div class="gacha-hd"><div class="circle"><span>✨</span></div></div><h2>🌌 Reincarnation Summoning</h2><div class="sub" style="color:#e7e3f1">The goddess is about to send you to a fantasy world. Each hero receives one <b>cheat skill</b> — use it with the <b>Power key</b> during a challenge. Skills cost ⚡ mana (you start with 2 and gain 1 every round).</div><div class="row"><button class="btn go" data-v="go">✨ Summon!</button></div>`, 560);
    sfx('win');
  }
  const cards = M.players.map((p, i) => { const S = SKILLS[p.cheat], R = RARITY[S.rar];
    return `<div class="skc ${S.rar === 'SSR' ? 'ssr' : ''}" style="--rc:${R.col};--d:${(0.15 + i * 0.35).toFixed(2)}s"><div class="who" style="color:${p.color}">${RACES[p.race].emoji} ${esc(p.name)}</div><div class="rar">${R.name.toUpperCase()}</div><div class="ico">${S.icon}</div><div class="nm">${S.name}</div><div class="ds">${S.desc}</div><div class="ds" style="color:#67e8f9;font-weight:800">${S.passive ? 'PASSIVE' : '⚡ ' + S.cost + ' mana'}</div></div>`; }).join('');
  if (M.players.some(p => !p.bot)) await ask(`<h2>🌌 Cheat skills awakened!</h2><div class="gacha">${cards}</div><div class="keys">${M.players.filter(p => !p.bot && p.cheat && !SKILLS[p.cheat].passive).map(p => `<div><span class="dot" style="display:inline-block;background:${p.color}"></span> <b>${esc(p.name)}</b> Power key: <kbd>${POWLABEL[p.id]}</kbd>${COARSE && p.id === M.players.findIndex(q => !q.bot) ? ' (or the ⚡ button)' : ''}</div>`).join('') || '<div>Passive skills work automatically.</div>'}</div><div class="row"><button class="btn go" data-v="go">Begin the adventure!</button></div>`, 720);
}

async function playMatch() {
  MODE = 'map'; musSync(); $('quit').classList.remove('hidden');
  await summonPhase();
  await say(`👑 The princess has been captured! ${M.players.length} heroes set out from the Royal Village…`, 2000);
  while (!M.over) {
    M.round++;
    if (M.round > M.max) { M.over = true; M.ending = 'dragon'; break; }
    banner(`🗺️ Round <b>${M.round}</b> / ${M.max}`, 1500); await wait(500);
    await worldEvent();
    await cardsPhase();
    const r = await playRound();
    await applyRound(r);
    M.players.forEach(p => { p.mana = Math.min(4, p.mana + 1); });
  }
  await finale();
}

    if (M.ending === 'angel') for (let k = 0; k < 4; k++) if (Math.random() < 0.15) E.parts.push({ x: Math.random() * W, y: -10, vx: rr(-20, 20), vy: rr(50, 90), emoji: '🪶', s: 20, life: 6 });

[0, 1, 2, 3].forEach(i => { window['cfgBot' + i] = v => { CFG.slots[i].bot = v === 'b'; saveCfg(); renderSetup(); }; });

function howTo() {
  ovOpen(`<h2>How to play</h2><div class="list" style="text-align:left;font-size:13px;line-height:1.5">
   <div class="item" style="cursor:default"><span class="ic">🗺️</span><span><div class="tt">Cross the map</div><div class="ds">Every round is a mini-game. Finish high to move forward, finish last and you may slide back. At the Crossroads pick a route: short and dangerous, or long and safe.</div></span></div>

window.__party = { get M() { return M; }, get CFG() { return CFG; }, GAMES, BOSS_DEF, NODES, runGame, makeCtx, stepGame, finishResult, clearEdges, startMatch, showSetup, setFast(v) { FAST = v; }, wipe, uiSetup, uiTick, tsClear, TS, UIX, get MODE() { return MODE; }, get CUR() { return CUR; }, INP, drawMap, SKILLS, rollSkill, usePower, summonPhase, splash };
