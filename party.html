<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Save the Princess — Yutfi MiniGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root{--gold:#fbbf24;--ink:#0a0710;--panel:#17102a;--line:#ffffff22;--txt:#e7e3f1;--dim:#a39cba}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07040d;color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden;user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% 0%,#2a1745 0%,#07040d 70%)}
#cv{width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;display:block;background:#12091f;box-shadow:0 0 0 1px #ffffff14,0 20px 80px #000;touch-action:none}
.hidden{display:none!important}
#top{position:fixed;left:8px;top:6px;z-index:30;display:flex;gap:6px}
.chip{border:1px solid var(--line);background:#120b22cc;color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;text-decoration:none;backdrop-filter:blur(4px)}
.chip:hover{background:#2a1c4acc}
#ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(6,3,12,.78);backdrop-filter:blur(5px);overflow:auto}
.card{width:min(100%,var(--w,640px));max-height:100%;overflow:auto;border-radius:20px;padding:18px;background:linear-gradient(180deg,#241440,#150c27);border:1px solid #ffffff26;box-shadow:0 24px 80px #000c;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
h1,h2,h3{font-family:'Cinzel',Georgia,serif;margin:0;color:#fff;text-align:center}
h1{font-size:clamp(26px,5vw,40px);text-shadow:0 3px 0 #000,0 0 28px #fb923c66}
h2{font-size:clamp(20px,3.6vw,28px)}
.sub{color:var(--dim);text-align:center;font-size:13px;margin:6px 0 12px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:#3b2a66;box-shadow:0 3px 0 #1a1033;font-family:inherit}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1a1033}
.btn.go{background:linear-gradient(180deg,#fde68a,#f59e0b);color:#1b0f00;box-shadow:0 4px 0 #92400e}
.btn.dim{background:#241a3d;color:#c7bfe0}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.seg button{border:0;background:#1d1432;color:#c7bfe0;padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:#f59e0b;color:#1b0f00}
.slot{border:1px solid var(--line);border-radius:14px;padding:10px;background:#1c1233;margin-top:8px;display:grid;gap:8px}
.slot .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.slot input[type=text]{background:#0e0819;border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 9px;font-weight:700;width:130px;font-family:inherit}
.races{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.race{border:1px solid var(--line);border-radius:12px;padding:6px 4px;background:#120b22;color:#fff;cursor:pointer;text-align:center;font-family:inherit}
.race .e{font-size:26px;line-height:1.1}.race .n{font-size:11px;font-weight:800}
.race.on{outline:2px solid var(--gold);background:#2d1d52}
.abil{font-size:11.5px;color:var(--dim);line-height:1.35;min-height:30px}
.abil b{color:var(--gold)}
.big{font-size:clamp(44px,12vw,70px);text-align:center;line-height:1}
.list{display:grid;gap:6px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:#1d1334;border:1px solid var(--line);text-align:left;color:#fff;cursor:pointer;font-family:inherit;width:100%}
.item:hover:not([disabled]){background:#2c1d52}
.item[disabled]{opacity:.45;cursor:default}
.item .ic{font-size:26px;width:34px;text-align:center}
.item .tt{font-weight:800;font-size:14px}.item .ds{font-size:11.5px;color:var(--dim)}
.item .rt{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#ffffff1a;color:#e9d5ff}
.res{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#1d1334;margin-top:6px}
.res .pl{font-weight:800;flex:1;text-align:left}.res .md{font-size:22px;width:34px;text-align:center}
.res .mv{font-weight:800;min-width:60px;text-align:right}
.up{color:#86efac}.down{color:#fca5a5}.gd{color:var(--gold)}
#banner{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:35;padding:10px 18px;border-radius:14px;background:#120b22ee;border:1px solid #fbbf2466;font-weight:800;font-size:15px;max-width:92vw;text-align:center;box-shadow:0 10px 40px #000a;animation:pop .2s ease-out}
#touch{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-between;padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;pointer-events:auto}
#touch button{border:1px solid #fff4;background:#ffffff26;color:#fff;border-radius:14px;font-size:22px;font-weight:800;touch-action:none;backdrop-filter:blur(3px)}
#touch button.on{background:#f59e0bcc}
#touch .act{pointer-events:auto;align-self:flex-end;width:92px;height:92px;border-radius:50%;font-size:15px}
.rot{display:none}
@media (orientation:portrait) and (max-width:700px){.rot{display:block;position:fixed;left:0;right:0;top:50px;text-align:center;z-index:20;font-size:12px;font-weight:800;color:#fcd34d}}
.keys{font-size:11.5px;color:var(--dim);line-height:1.6;text-align:center;margin-top:8px}
.keys kbd{background:#0e0819;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:#fff;font-weight:800}
.conf{position:fixed;inset:0;pointer-events:none;z-index:36}
#ov.end{background:transparent;backdrop-filter:none;align-items:flex-end}
#ov.end{padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px}.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1.5px solid #fff4;background:#ffffff10}
.card .row.sticky{position:sticky;bottom:-18px;background:linear-gradient(180deg,transparent,#150c27 40%);padding:10px 0 4px;margin-top:6px}
#ov.end .card{background:linear-gradient(180deg,#241440ee,#150c27ee)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="rot">📱 Best in landscape — rotate your phone</div>
<div id="top"><a class="chip" href="index.html" id="home">← Yutfi MiniGames</a><button class="chip" id="snd" onclick="toggleAudio()">🔊</button><button class="chip hidden" id="quit" onclick="quitMatch()">⏏ Quit</button></div>
<div id="touch" class="hidden">
  <div class="pad"><span></span><button data-k="u">▲</button><span></span><button data-k="l">◀</button><span></span><button data-k="r">▶</button><span></span><button data-k="d">▼</button><span></span></div>
  <button class="act" data-k="a">ACTION</button>
</div>
<div id="banner" class="hidden"></div>
<div id="ov" class="hidden"><div class="card" id="ovcard"></div></div>
<script>
'use strict';
/* ============================================================
   SAVE THE PRINCESS — a local party game (2–4 players, bots fill in)
   Part 1: helpers, input, audio, mini-game runtime
   ============================================================ */
const $ = id => document.getElementById(id);
const W = 960, H = 540;
const cv = $('cv'), c = cv.getContext('2d');
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const RACES = {
  human:  { name: 'Human',  emoji: '🧑', tag: 'Balanced', ab: 'Second Chance',      abd: 'Cancels your first setback (a move backwards).' },
  angel:  { name: 'Angel',  emoji: '👼', tag: 'Airborne', ab: 'Divine Protection',  abd: 'Blocks the first sabotage aimed at you. Floaty jumps.' },
  devil:  { name: 'Devil',  emoji: '😈', tag: 'Brawler',  ab: 'Infernal Strength',  abd: 'Your first win moves you 1 extra space. Pushes harder.' },
  wizard: { name: 'Wizard', emoji: '🧙', tag: 'Trickster', ab: 'Magical Trick',     abd: 'Reflects the first sabotage back at whoever sent it.' }
};
const PCOL = ['#ef4444', '#3b82f6', '#22c55e', '#eab308'];

/* ---------- drawing helpers ---------- */
function txt(s, x, y, size = 20, col = '#fff', align = 'center', stroke) {
  c.font = `800 ${size}px 'Plus Jakarta Sans',system-ui,sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineWidth = Math.max(3, size / 6); c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
function emo(e, x, y, size = 30, alpha = 1) {
  c.save(); c.globalAlpha = alpha; c.font = `${size}px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(e, x, y); c.restore();
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  c.beginPath(); c.roundRect(x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 2) { c.beginPath(); c.arc(x, y, r, 0, 7); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); } }
function shadow(x, y, rx, ry = rx * 0.3, a = 0.3) { c.save(); c.globalAlpha = a; c.fillStyle = '#000'; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill(); c.restore(); }
function sky(c1, c2) { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); c.fillStyle = g; c.fillRect(0, 0, W, H); }
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- audio: effects + a bright party theme (all generated, no files) ---------- */
let audioOn = true, sfxSynth = null, noiseS = null, mus = null, musTimer = 0, audioReady = false;
try { if (localStorage.getItem('sl-party-audio') === 'off') audioOn = false; } catch (e) {}
function audioInit() {
  if (audioReady || typeof Tone === 'undefined') return;
  audioReady = true;
  try {
    sfxSynth = new Tone.PolySynth(Tone.Synth, { volume: -9, oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.14, sustain: 0.05, release: 0.2 } }).toDestination();
    noiseS = new Tone.NoiseSynth({ volume: -14, noise: { type: 'brown' }, envelope: { attack: 0.005, decay: 0.3, sustain: 0 } }).toDestination();
  } catch (e) { sfxSynth = noiseS = null; }
  try { Tone.start(); } catch (e) {}
  buildMus();
}
function sfx(n) {
  if (!audioOn || !sfxSynth || Tone.context.state !== 'running') return;
  try {
    const t = Tone.now() + 0.01, s = sfxSynth, q = (nn, d) => s.triggerAttackRelease(nn, d, t);
    switch (n) {
      case 'tick': q('C5', '32n'); break;
      case 'go': q(['C5', 'G5', 'C6'], '8n'); break;
      case 'hit': q('A3', '32n'); break;
      case 'coin': q(['E6', 'B6'], '32n'); break;
      case 'good': q(['C5', 'E5'], '16n'); break;
      case 'bad': q(['E3', 'Bb2'], '16n'); break;
      case 'boom': if (noiseS) noiseS.triggerAttackRelease('8n', t); break;
      case 'shoot': q('G5', '64n'); break;
      case 'jump': q('E5', '32n'); break;
      case 'win': q(['C5', 'E5', 'G5', 'C6'], '4n'); break;
      case 'lose': q(['G3', 'E3', 'C3'], '4n'); break;
      case 'card': q(['A5', 'E6'], '16n'); break;
    }
  } catch (e) {}
}
function buildMus() {
  if (mus || typeof Tone === 'undefined') return;
  try {
    const bus = new Tone.Volume(-80).toDestination();
    const verb = new Tone.Reverb({ decay: 3, wet: 0.3 }).connect(bus);
    const pad = new Tone.PolySynth(Tone.Synth, { volume: -19, oscillator: { type: 'fatsawtooth', count: 3, spread: 18 }, envelope: { attack: 0.8, decay: 0.3, sustain: 0.8, release: 1.6 } }).connect(new Tone.Filter(1200, 'lowpass').connect(verb));
    const pl = new Tone.PolySynth(Tone.Synth, { volume: -16, oscillator: { type: 'triangle' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.4 } }).connect(verb);
    const bass = new Tone.Synth({ volume: -10, oscillator: { type: 'triangle' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.2 } }).connect(bus);
    const drum = new Tone.MembraneSynth({ volume: -13, pitchDecay: 0.04, octaves: 2, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 } }).connect(bus);
    const hat = new Tone.NoiseSynth({ volume: -28, noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.04, sustain: 0 } }).connect(new Tone.Filter(7000, 'highpass').connect(bus));
    const CH = [['G3', 'B3', 'D4'], ['E3', 'G3', 'B3'], ['C3', 'E3', 'G3'], ['D3', 'F#3', 'A3']];
    const BS = ['G2', 'E2', 'C3', 'D3'];
    const MEL = [['0:0:0', 'B4', '8n'], ['0:0:2', 'D5', '8n'], ['0:1:0', 'G5', '4n'], ['0:2:2', 'F#5', '8n'], ['0:3:0', 'D5', '4n'],
      ['1:0:0', 'E5', '8n'], ['1:0:2', 'G5', '8n'], ['1:1:0', 'B5', '4n'], ['1:2:2', 'A5', '8n'], ['1:3:0', 'G5', '4n'],
      ['2:0:0', 'G5', '8n'], ['2:0:2', 'E5', '8n'], ['2:1:0', 'C5', '4n'], ['2:2:0', 'E5', '4n'], ['2:3:0', 'G5', '4n'],
      ['3:0:0', 'F#5', '4n.'], ['3:1:2', 'E5', '8n'], ['3:2:0', 'D5', '2n']];
    const parts = [
      new Tone.Part((t, ch) => pad.triggerAttackRelease(ch, '1m', t), CH.map((ch, i) => [i + ':0:0', ch])),
      new Tone.Part((t, n) => bass.triggerAttackRelease(n, '8n', t), BS.flatMap((n, i) => [[i + ':0:0', n], [i + ':1:2', n], [i + ':2:0', n], [i + ':3:2', n]])),
      new Tone.Part((t, m) => pl.triggerAttackRelease(m[0], m[1], t, 0.75), MEL.map(m => [m[0], [m[1], m[2]]])),
      new Tone.Part((t, v) => drum.triggerAttackRelease('C2', '8n', t, v), [0, 1, 2, 3].flatMap(i => [[i + ':0:0', 0.9], [i + ':2:0', 0.6]])),
      new Tone.Part((t) => hat.triggerAttackRelease('32n', t), [0, 1, 2, 3].flatMap(i => [0, 1, 2, 3].map(k => [i + ':' + k + ':2'])))
    ];
    parts.forEach(p => { p.loop = true; p.loopEnd = '4m'; p.start(0); });
    Tone.Transport.bpm.value = 112;
    mus = { bus };
    musSync(2);
  } catch (e) { mus = null; }
}
function musSync(fade) {
  if (!mus) return;
  try {
    clearTimeout(musTimer);
    if (audioOn && !document.hidden) { if (Tone.Transport.state !== 'started') Tone.Transport.start('+0.05'); mus.bus.volume.rampTo(MODE === 'game' ? -26 : -17, fade == null ? 1 : fade); }
    else { mus.bus.volume.rampTo(-80, 0.4); musTimer = setTimeout(() => { try { Tone.Transport.pause(); } catch (e) {} }, 600); }
  } catch (e) {}
}
function toggleAudio() {
  audioOn = !audioOn; try { localStorage.setItem('sl-party-audio', audioOn ? 'on' : 'off'); } catch (e) {}
  $('snd').textContent = audioOn ? '🔊' : '🔇'; audioInit(); musSync(0.3);
}
document.addEventListener('visibilitychange', () => musSync(0.3));
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => audioInit(), { once: true, capture: true }));

/* ---------- input: five buttons per player (left/right/up/down/action) ---------- */
const KEYS = [
  { l: 'KeyA', r: 'KeyD', u: 'KeyW', d: 'KeyS', a: 'Space' },
  { l: 'ArrowLeft', r: 'ArrowRight', u: 'ArrowUp', d: 'ArrowDown', a: 'Enter' },
  { l: 'KeyJ', r: 'KeyL', u: 'KeyI', d: 'KeyK', a: 'KeyU' },
  { l: 'Numpad4', r: 'Numpad6', u: 'Numpad8', d: 'Numpad5', a: 'Numpad0' }
];
const KEYLABEL = ['A D W S · Space', '← → ↑ ↓ · Enter', 'J L I K · U', 'Num 4 6 8 5 · Num 0'];
const newInp = () => ({ l: 0, r: 0, u: 0, d: 0, a: 0, lp: 0, rp: 0, up: 0, dp: 0, ap: 0 });
const INP = [newInp(), newInp(), newInp(), newInp()];
const CODE = {};
KEYS.forEach((k, i) => Object.entries(k).forEach(([dir, code]) => { CODE[code] = { i, dir }; }));
let PL = [];                          // the party's players (see Part 3)
const humanSeat = i => PL[i] && !PL[i].bot;
function press(i, dir) { const p = INP[i]; if (!p[dir]) p[dir + 'p'] = 1; p[dir] = 1; }
function release(i, dir) { INP[i][dir] = 0; }
window.addEventListener('keydown', e => {
  const m = CODE[e.code];
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName)) return;
  if (m && MODE === 'game') e.preventDefault();
  if (!m || !humanSeat(m.i) || e.repeat) return;
  press(m.i, m.dir);
});
window.addEventListener('keyup', e => { const m = CODE[e.code]; if (m) release(m.i, m.dir); });
window.addEventListener('blur', () => INP.forEach(p => { p.l = p.r = p.u = p.d = p.a = 0; }));
function clearEdges() { INP.forEach(p => { p.lp = p.rp = p.up = p.dp = p.ap = 0; }); }
// touch pad drives seat 0 (the first human)
const touchSeat = () => PL.findIndex(p => p && !p.bot);
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const dn = e => { e.preventDefault(); const s = touchSeat(); if (s < 0) return; b.classList.add('on'); press(s, k); };
  const up = e => { e.preventDefault(); const s = touchSeat(); b.classList.remove('on'); if (s >= 0) release(s, k); };
  b.addEventListener('pointerdown', dn); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
const COARSE = typeof matchMedia === 'function' && matchMedia('(pointer:coarse)').matches;

/* ---------- mini-game registry + runtime ---------- */
const GAMES = [];
const reg = g => { GAMES.push(g); return g; };
let MODE = 'setup';
let CUR = null;
const SKILL = { easy: 0.38, normal: 0.62, hard: 0.86 };

// parts: array of party players taking part.  Returns { rank:[local idx best→worst], score:[...], extra }
function makeCtx(def, parts, opts = {}) {
  const G = {
    def, opts, n: parts.length, W, H, t: 0, cd: 3.2, go: 0, diff: opts.diff || 0, seed: (Math.random() * 1e9) | 0,
    P: parts.map((p, i) => ({ i, pid: p.id, name: p.name, color: PCOL[p.id], race: p.race, bot: p.bot, skill: clamp(p.skill + (opts.diff || 0) * 0.1, 0.2, 0.95), gear: p.gear || {} })),
    in: parts.map(() => newInp()), stun: parts.map(() => 0), rev: parts.map(() => 0),
    hold(i, k, on) { INP[G.P[i].pid][k] = on ? 1 : 0; },
    tap(i, k) { const q = INP[G.P[i].pid]; q[k] = 1; q[k + 'p'] = 1; },
    mul(i, what) {                                   // race + equipment traits
      const p = G.P[i], g = p.gear; let m = 1;
      if (what === 'speed' && g.boots) m *= 1.08;
      if (what === 'push') { if (p.race === 'devil') m *= 1.12; if (g.gauntlets) m *= 1.25; }
      if (what === 'jump' && p.race === 'angel') m *= 1.12;
      return m;
    }
  };
  (opts.effects || []).forEach((e, i) => { if (e) { G.stun[i] = e.freeze ? 2 : 0; G.rev[i] = e.reverse ? 7 : 0; } });
  G.rand = seeded(G.seed);
  return G;
}
function stepGame(R, dt) {
  const G = R.G;
  G.t += dt;

   <div class="item" style="cursor:default"><span class="ic">👾</span><span><div class="tt">Bosses</div><div class="ds">Standing on a boss space triggers a co-op fight. Everybody fights together — but the top damage dealer gets the bonus.</div></span></div>
   <div class="item" style="cursor:default"><span class="ic">🏰</span><span><div class="tt">The Dark Castle</div><div class="ds">Reaching the castle is not enough! Clear every trial — Gate, Dungeon, Dragon, Tower, Princess Chamber — by finishing top of the mini-games. First to finish rescues the princess. If nobody does before the last round, the dragon wins.</div></span></div>
   <div class="item" style="cursor:default"><span class="ic">⌨️</span><span><div class="tt">Controls</div><div class="ds">Every mini-game uses just four direction keys and one action key per player. P1: ${KEYLABEL[0]} · P2: ${KEYLABEL[1]} · P3: ${KEYLABEL[2]} · P4: ${KEYLABEL[3]}. Phones: P1 uses the on-screen pad; chess is click/tap.</div></span></div></div>
   <div class="row"><button class="btn go" onclick="renderSetup()">Got it</button></div>`, 680);
}
async function startMatch(cfg) {
  cfg = cfg || CFG; if (!cfg.slots.slice(0, cfg.n).length) return;
  cfg.slots.forEach((s, i) => { if (!String(s.name).trim()) s.name = s.bot ? BOT_NAMES[i] : 'Player ' + (i + 1); });
  saveCfg(); ovClose(); $('ov').classList.remove('end'); audioInit();
  setupMatch(JSON.parse(JSON.stringify(cfg))); await playMatch();
}
async function quitMatch() {
  if (MODE === 'game' && CUR) { /* keep playing under the dialog */ }
  const v = await ask(`<h2>Quit this adventure?</h2><div class="sub">Your progress will be lost.</div><div class="row"><button class="btn dim" data-v="no">Keep playing</button><button class="btn go" data-v="yes">Quit</button></div>`, 420);
  if (v === 'yes') location.reload(); else if (MODE === 'setup') renderSetup();
}

/* ---------- boot ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  try { if (MODE === 'game' && CUR) gameFrame(dt); else if (MODE === 'end' && END) drawEnd(dt); else drawMap(dt); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
$('snd').textContent = audioOn ? '🔊' : '🔇';
window.__party = { get M() { return M; }, get CFG() { return CFG; }, GAMES, BOSS_DEF, NODES, runGame, makeCtx, stepGame, finishResult, clearEdges, startMatch, showSetup, setFast(v) { FAST = v; }, get MODE() { return MODE; }, get CUR() { return CUR; }, INP, drawMap };
showSetup();
requestAnimationFrame(frame);

</script>
